<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>YapApp</title>
<style>
  :root {
    --bg: #1e1f24; --panel: #17181c; --line: #2c2e35; --text: #e6e6ea;
    --muted: #8b8d97; --accent: #5b8cff; --input: #26282f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  .hidden { display: none !important; }

  /* Join screen */
  #join { height: 100%; display: flex; align-items: center; justify-content: center; }
  #join form { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 28px; width: 320px; display: flex; flex-direction: column; gap: 12px; }
  #join h1 { margin: 0 0 4px; font-size: 20px; }
  #join p { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
  label { font-size: 12px; color: var(--muted); }
  input, textarea { width: 100%; background: var(--input); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 11px; font: inherit; outline: none; }
  input:focus, textarea:focus { border-color: var(--accent); }
  button { background: var(--accent); color: white; border: 0; border-radius: 8px; padding: 9px 14px;
    font: inherit; font-weight: 600; cursor: pointer; }
  button:hover { filter: brightness(1.1); }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }

  /* Chat screen */
  #chat { height: 100%; display: flex; }
  aside { width: 210px; background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 16px; gap: 6px; }
  aside .roomRow { display: flex; align-items: flex-start; gap: 6px; }
  aside .room { font-weight: 700; font-size: 16px; word-break: break-word; flex: 1; }
  #renameBtn { background: none; border: 0; color: var(--muted); padding: 2px 4px; font-size: 14px; cursor: pointer; }
  #renameBtn:hover { color: var(--text); }
  #renameInput { font-weight: 700; font-size: 15px; padding: 4px 6px; }
  aside .me { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  aside h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 6px 0 4px; }
  #peers { list-style: none; margin: 0; padding: 0; flex: 1; overflow-y: auto; }
  #peers li { padding: 3px 0; display: flex; align-items: center; gap: 8px; }
  #peers li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #3ecf6e; }
  #peers li.none { color: var(--muted); font-style: italic; }
  #peers li.none::before { background: var(--muted); }

  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .msg { padding: 3px 0; }
  .msg .head { display: flex; gap: 8px; align-items: baseline; margin-top: 10px; }
  .msg .name { font-weight: 700; }
  .msg .time { color: var(--muted); font-size: 11px; }
  .msg .text { white-space: pre-wrap; word-wrap: break-word; }
  .sys { color: var(--muted); font-size: 12px; font-style: italic; padding: 6px 0; }
  .empty { color: var(--muted); text-align: center; margin-top: 30%; }

  #updateBar { display: flex; align-items: center; gap: 12px; padding: 8px 16px;
    background: #24365f; border-bottom: 1px solid var(--line); font-size: 13px; }
  #updateBar span { flex: 1; }
  #updateBar button { padding: 5px 12px; }
  #join .or { text-align: center; color: var(--muted); font-size: 12px; margin: 4px 0; }
  #join .row { display: flex; gap: 8px; }
  #join .row input { flex: 1; }
  #joinError { color: #ff7b7b; font-size: 13px; min-height: 18px; margin: 0; }
  #invitePreview { color: var(--muted); font-size: 12px; min-height: 16px; margin-top: -6px; }
  #inviteBar { padding: 10px 16px; background: #1f3a2c; border-bottom: 1px solid var(--line); font-size: 13px; }
  #inviteBar .top { display: flex; align-items: center; gap: 10px; }
  #inviteBar .top span { flex: 1; }
  #inviteBar code { display: block; margin-top: 6px; padding: 6px 8px; background: var(--input); border-radius: 6px;
    font: 12px Consolas, monospace; word-break: break-all; user-select: all; }
  #inviteBar button { padding: 5px 12px; }
  #version { color: var(--muted); font-size: 11px; text-align: center; margin-top: 4px; }
  #composer { display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); }
  #composer textarea { resize: none; height: 42px; max-height: 140px; }

  /* Phones / narrow windows: sidebar becomes a compact header */
  @media (max-width: 640px) {
    #join { align-items: flex-start; padding: 16px; overflow-y: auto; }
    #join form { width: 100%; padding: 20px; }
    #chat { flex-direction: column; }
    aside { width: auto; flex-direction: row; flex-wrap: wrap; align-items: center;
      padding: 8px 12px; gap: 6px 8px; border-right: 0; border-bottom: 1px solid var(--line); }
    aside .roomRow { flex: 1 1 100%; align-items: center; }
    aside .me, aside h3, #version { display: none; }
    #peers { flex: 1 1 auto; display: flex; gap: 12px; overflow-x: auto; white-space: nowrap; font-size: 12px; }
    aside button.ghost { padding: 5px 10px; font-size: 12px; }
    #messages { padding: 8px 12px; }
    #composer { padding: 8px 10px; }
    #updateBar, #inviteBar { padding: 8px 12px; }
    #inviteBar .top { flex-wrap: wrap; }
    #inviteBar .top span { flex: 1 1 100%; }
  }
</style>
</head>
<body>

<section id="join">
  <form id="joinForm">
    <h1>YapApp</h1>
    <p>No server. Rooms are private: you can only get in with an invite code.</p>
    <label for="name">Your name</label>
    <input id="name" maxlength="40" autocomplete="off">

    <label for="invite">Join a room</label>
    <div class="row">
      <input id="invite" autocomplete="off" placeholder="paste invite code (yap1-...)">
      <button type="button" id="joinBtn">Join</button>
    </div>
    <div id="invitePreview"></div>

    <div class="or">or</div>

    <label for="newRoom">Create a room</label>
    <div class="row">
      <input id="newRoom" maxlength="40" autocomplete="off" placeholder="room name">
      <button type="button" id="createBtn">Create</button>
    </div>
    <p id="joinError"></p>
  </form>
</section>

<section id="chat" class="hidden">
  <aside>
    <div class="roomRow">
      <div class="room" id="roomLabel"></div>
      <input id="renameInput" class="hidden" maxlength="40" autocomplete="off">
      <button id="renameBtn" title="Rename room">✎</button>
    </div>
    <div class="me" id="meLabel"></div>
    <h3>Online</h3>
    <ul id="peers"></ul>
    <button class="ghost" id="inviteBtn">Invite people</button>
    <button class="ghost" id="leaveBtn">Leave room</button>
    <div id="version"></div>
  </aside>
  <main>
    <div id="updateBar" class="hidden">
      <span id="updateText"></span>
      <button id="updateBtn">Restart to update</button>
      <button class="ghost" id="updateLater">Later</button>
    </div>
    <div id="inviteBar" class="hidden">
      <div class="top">
        <span>Share this invite code with people you want in the room. Anyone who has it can join, so only send it privately.</span>
        <button id="copyInvite">Copy</button>
        <button class="ghost" id="closeInvite">Close</button>
      </div>
      <code id="inviteCode"></code>
    </div>
    <div id="messages"></div>
    <form id="composer">
      <textarea id="input" placeholder="Message… (Enter to send, Shift+Enter for new line)"></textarea>
      <button type="submit">Send</button>
    </form>
  </main>
</section>

<script>
  const $ = id => document.getElementById(id)
  const messagesEl = $('messages')
  let lastName = null

  // Settings are kept by the main process in settings.json (see main.js).
  let settings = {}
  function store (k, v) { settings[k] = v; chat.setSettings({ [k]: v }) }
  function load (k) { return settings[k] || '' }
  function forget (k) { delete settings[k]; chat.setSettings({ [k]: null }) }

  // Remembered login: auto-join on startup until it hasn't been used for SESSION_DAYS.
  const SESSION_DAYS = 30
  function touchSession () { store('lastUsed', String(Date.now())) }

  function colorFor (name) {
    let h = 0
    for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360
    return `hsl(${h}, 70%, 68%)`
  }

  function fmtTime (ts) {
    const d = new Date(ts)
    const today = new Date().toDateString() === d.toDateString()
    const t = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    return today ? t : d.toLocaleDateString() + ' ' + t
  }

  function nearBottom () {
    return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 80
  }

  function addMsg (m, forceScroll) {
    const stick = forceScroll || nearBottom()
    messagesEl.querySelector('.empty')?.remove()
    const div = document.createElement('div')
    div.className = 'msg'
    if (m.name !== lastName) {
      const head = document.createElement('div')
      head.className = 'head'
      const n = document.createElement('span')
      n.className = 'name'
      n.textContent = m.name
      n.style.color = colorFor(m.name)
      const t = document.createElement('span')
      t.className = 'time'
      t.textContent = fmtTime(m.ts)
      head.append(n, t)
      div.append(head)
    }
    const text = document.createElement('div')
    text.className = 'text'
    text.textContent = m.text
    div.append(text)
    messagesEl.append(div)
    lastName = m.name
    if (stick) messagesEl.scrollTop = messagesEl.scrollHeight
  }

  function addSys (text) {
    const div = document.createElement('div')
    div.className = 'sys'
    div.textContent = text
    messagesEl.append(div)
    lastName = null
    if (nearBottom()) messagesEl.scrollTop = messagesEl.scrollHeight
  }

  function renderHistory (list) {
    messagesEl.innerHTML = ''
    lastName = null
    if (!list.length) {
      const e = document.createElement('div')
      e.className = 'empty'
      e.textContent = 'No messages yet. Say hi!'
      messagesEl.append(e)
      return
    }
    for (const m of list) addMsg(m, true)
  }

  chat.on('history', renderHistory)
  chat.on('message', m => addMsg(m))
  chat.on('system', addSys)
  chat.on('peers', list => {
    const ul = $('peers')
    ul.innerHTML = ''
    if (!list.length) {
      const li = document.createElement('li')
      li.className = 'none'
      li.textContent = 'Looking for peers…'
      ul.append(li)
    }
    for (const n of list) {
      const li = document.createElement('li')
      li.textContent = n
      ul.append(li)
    }
  })

  function showError (text) { $('joinError').textContent = text || '' }

  // Room name + its current invite code (renames come from us or from peers).
  function showRoom (info) {
    $('roomLabel').textContent = '# ' + info.room
    $('inviteCode').textContent = info.invite
    store('invite', info.invite) // same secret, newest name
  }
  chat.on('room', showRoom)

  function startRename () {
    const input = $('renameInput')
    input.value = $('roomLabel').textContent.replace(/^# /, '')
    $('roomLabel').classList.add('hidden')
    $('renameBtn').classList.add('hidden')
    input.classList.remove('hidden')
    input.focus(); input.select()
  }
  async function finishRename (save) {
    const input = $('renameInput')
    if (input.classList.contains('hidden')) return
    input.classList.add('hidden')
    $('roomLabel').classList.remove('hidden')
    $('renameBtn').classList.remove('hidden')
    const name = input.value.trim()
    if (save && name) {
      const info = await chat.renameRoom(name)
      if (info) showRoom(info)
    }
  }
  $('renameBtn').addEventListener('click', startRename)
  $('roomLabel').addEventListener('dblclick', startRename)
  $('renameInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); finishRename(true) }
    if (e.key === 'Escape') { e.preventDefault(); finishRename(false) }
  })
  $('renameInput').addEventListener('blur', () => finishRename(true))

  async function enterRoom (name, invite, showInvite) {
    const res = await chat.join(name, invite)
    if (!res.ok) { showError(res.error); return false }
    showError('')
    store('name', name); store('invite', invite)
    touchSession()
    showRoom(res)
    $('meLabel').textContent = 'you are ' + name
    $('inviteBar').classList.toggle('hidden', !showInvite)
    $('join').classList.add('hidden')
    $('chat').classList.remove('hidden')
    $('peers').innerHTML = '<li class="none">Looking for peers…</li>'
    $('input').focus()
    return true
  }

  function needName () {
    const name = $('name').value.trim()
    if (!name) { showError('Type your name first.'); $('name').focus() }
    return name
  }

  $('joinBtn').addEventListener('click', () => {
    const name = needName(); if (!name) return
    const invite = $('invite').value.trim()
    if (!invite) { showError('Paste an invite code, or create a room.'); return }
    enterRoom(name, invite, false)
  })
  $('createBtn').addEventListener('click', async () => {
    const name = needName(); if (!name) return
    const roomName = $('newRoom').value.trim()
    if (!roomName) { showError('Give the new room a name.'); $('newRoom').focus(); return }
    const invite = await chat.createInvite(roomName)
    $('newRoom').value = ''
    enterRoom(name, invite, true) // show the invite so it can be shared right away
  })
  $('invite').addEventListener('input', async () => {
    const code = $('invite').value.trim()
    const room = code ? await chat.checkInvite(code) : null
    $('invitePreview').textContent = room ? 'Room: ' + room : (code ? 'Not a valid invite code' : '')
  })
  $('invite').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('joinBtn').click() } })
  $('newRoom').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('createBtn').click() } })
  $('joinForm').addEventListener('submit', e => e.preventDefault())

  $('inviteBtn').addEventListener('click', () => $('inviteBar').classList.toggle('hidden'))
  $('closeInvite').addEventListener('click', () => $('inviteBar').classList.add('hidden'))
  $('copyInvite').addEventListener('click', async () => {
    await chat.copy($('inviteCode').textContent)
    $('copyInvite').textContent = 'Copied!'
    setTimeout(() => { $('copyInvite').textContent = 'Copy' }, 1500)
  })

  $('leaveBtn').addEventListener('click', async () => {
    await chat.leave()
    forget('lastUsed') // leaving = log out; name and invite stay pre-filled
    $('name').value = load('name')
    $('invite').value = load('invite')
    $('invite').dispatchEvent(new Event('input'))
    $('chat').classList.add('hidden')
    $('join').classList.remove('hidden')
  })

  async function sendInput () {
    const input = $('input')
    const text = input.value
    if (!text.trim()) return
    input.value = ''
    const m = await chat.send(text)
    if (m) { addMsg(m, true); touchSession() }
  }

  $('composer').addEventListener('submit', e => { e.preventDefault(); sendInput() })
  // Phones: Enter is a new line and the Send button sends (like other chat apps).
  const IS_PHONE = !!window.YapNative
  if (IS_PHONE) {
    $('input').placeholder = 'Message…'
    $('input').setAttribute('enterkeyhint', 'enter')
  }
  $('input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !IS_PHONE) { e.preventDefault(); sendInput() }
  })

  // Self-update: main process downloads in the background, we offer a restart.
  chat.version().then(v => { $('version').textContent = 'YapApp v' + v })
  chat.on('update-ready', v => {
    const android = !!window.YapNative
    $('updateText').textContent = android
      ? `YapApp ${v} is available.`
      : `YapApp ${v} is ready. It also installs automatically when you close the app.`
    $('updateBtn').textContent = android ? 'Install update' : 'Restart to update'
    $('updateBar').classList.remove('hidden')
  })
  $('updateBtn').addEventListener('click', () => chat.installUpdate())
  $('updateLater').addEventListener('click', () => $('updateBar').classList.add('hidden'))

  // Startup: rejoin the remembered room, or ask again if the login expired.
  ;(async function startup () {
    settings = await chat.getSettings()
    const name = load('name'), invite = load('invite')
    const lastUsed = Number(load('lastUsed')) || 0
    const fresh = Date.now() - lastUsed < SESSION_DAYS * 24 * 3600 * 1000
    if (name && invite && fresh && await enterRoom(name, invite, false)) return
    if (lastUsed && !fresh) { forget('name'); forget('invite'); forget('lastUsed') }
    $('name').value = load('name')
    $('invite').value = load('invite')
    $('invite').dispatchEvent(new Event('input'))
  })()
</script>
</body>
</html>
