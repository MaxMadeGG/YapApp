name: Build installers

# Every push to main: rebuild the Windows + Linux installers and replace the
# files on the rolling "latest" release (fixed file names, so links never change).
# Installed apps self-update from that release (electron-updater, generic feed).
# Pushing a version tag like v0.2.0 also makes a permanent versioned release.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Give the rolling build a rising version (major.minor.<run number>)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          npm version --no-git-tag-version --allow-same-version "$base.${{ github.run_number }}"
      - name: Build (fixed names for the rolling build)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: >
          npx electron-builder ${{ matrix.target }} --publish never
          -c.nsis.artifactName='YapApp-Setup.${ext}'
          -c.linux.artifactName='YapApp.${ext}'
      - name: Build (versioned names for a tag)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          # latest*.yml + blockmaps are what installed apps read to self-update
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/*.blockmap

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out

      - name: Move the "latest" tag to this commit
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          git tag -f latest
          git push -f origin latest
      - name: Update the rolling "latest" release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Built automatically from the newest commit on main (${{ github.sha }}).
            - Windows: YapApp-Setup.exe
            - Linux: YapApp.AppImage (chmod +x, then run) or YapApp.deb (sudo apt install ./YapApp.deb)
          make_latest: true
          files: out/*

      - name: Versioned release for a tag
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          make_latest: false
          files: out/*
