name: Build installers

# Every push to main: rebuild the Windows + Linux installers + Android APK and replace the
# files on the rolling "latest" release (fixed file names, so links never change).
# Installed apps self-update from that release (electron-updater, generic feed).
# Pushing a version tag like v0.2.0 also makes a permanent versioned release.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Give the rolling build a rising version (major.minor.<run number>)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          npm version --no-git-tag-version --allow-same-version "$base.${{ github.run_number }}"
      - name: Build (fixed names for the rolling build)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: >
          npx electron-builder ${{ matrix.target }} --publish never
          -c.nsis.artifactName='YapApp-Setup.${ext}'
          -c.linux.artifactName='YapApp.${ext}'
      - name: Build (versioned names for a tag)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          # latest*.yml + blockmaps are what installed apps read to self-update
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/*.blockmap

  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Signing key present?
        id: key
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_B64 secret - skipping the Android APK"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.key.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android/package-lock.json
      - uses: actions/setup-java@v4
        if: steps.key.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 17
      - name: Version (same scheme as desktop)
        if: steps.key.outputs.skip != 'true'
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
            npm version --no-git-tag-version --allow-same-version "$base.${{ github.run_number }}"
          fi
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Decode signing key
        if: steps.key.outputs.skip != 'true'
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/yapapp.keystore"
          echo "YAPAPP_KEYSTORE=$RUNNER_TEMP/yapapp.keystore" >> "$GITHUB_ENV"
      - name: Prepare (Bare Kit, shared UI/core, addons, bundle)
        if: steps.key.outputs.skip != 'true'
        working-directory: android
        run: npm ci && npm run prepare
      - name: Build signed APK
        if: steps.key.outputs.skip != 'true'
        working-directory: android
        env:
          YAPAPP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
          YAPAPP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'androiddebugkey' }}
          YAPAPP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'android' }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --console=plain
      - name: Collect APK (+ update feed for the rolling build)
        if: steps.key.outputs.skip != 'true'
        run: |
          mkdir -p out
          apk=android/app/build/outputs/apk/release/app-release.apk
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            cp "$apk" "out/YapApp-$VERSION.apk"
          else
            cp "$apk" out/YapApp.apk
            # versionCode must match app/build.gradle: major*1000000 + minor*10000 + patch
            node -e "const v=process.env.VERSION,[a,b,c]=v.split('.').map(Number);require('fs').writeFileSync('out/android-latest.json',JSON.stringify({versionCode:a*1000000+b*10000+c,versionName:v,url:'https://github.com/MaxMadeGG/YapApp/releases/download/latest/YapApp.apk'}))"
            cat out/android-latest.json
          fi
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.skip != 'true'
        with:
          name: installers-android
          path: out/*

  release:
    needs: [build, android]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out

      - name: Move the "latest" tag to this commit
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          git tag -f latest
          git push -f origin latest
      - name: Update the rolling "latest" release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Built automatically from the newest commit on main (${{ github.sha }}).
            - Windows: YapApp-Setup.exe
            - Linux: YapApp.AppImage (chmod +x, then run) or YapApp.deb (sudo apt install ./YapApp.deb)
            - Android: YapApp.apk (installed apps update themselves)
          make_latest: true
          files: out/*

      - name: Versioned release for a tag
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          make_latest: false
          files: out/*
